name: Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Do NOT cancel an active release build when another commit is pushed.
# This is important because EAS builds run in the cloud and can take time.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Check app version
        id: version
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PREVIOUS_VERSION=""
          else
            PREVIOUS_VERSION=$(
              git show "${{ github.event.before }}:package.json" 2>/dev/null |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true
            )
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"

          echo "VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow run detected. Build will run."
            exit 0
          fi

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged. Skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed. Creating release."
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Install EAS CLI
        if: steps.version.outputs.changed == 'true'
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        if: steps.version.outputs.changed == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Authenticated Expo account:"
          eas whoami

      - name: Verify EAS project
        if: steps.version.outputs.changed == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Checking linked EAS project..."
          eas project:info

      - name: Build Android APK
        if: steps.version.outputs.changed == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > build.json

      - name: Display build result
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          echo "EAS build result:"
          cat build.json

      - name: Resolve APK URL
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          APK_URL=$(jq -r '
            if type == "array"
            then .[0].artifacts.buildUrl
            else .artifacts.buildUrl
            end
          ' build.json)

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Failed to resolve APK URL from build.json"
            exit 1
          fi

          echo "Resolved APK URL successfully."
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

      - name: Download APK
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          APK_FILE="ajiro-agent-${VERSION}.apk"

          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            "$APK_URL" \
            --output "$APK_FILE"

          if [ ! -s "$APK_FILE" ]; then
            echo "APK download failed or produced an empty file."
            exit 1
          fi

          echo "APK downloaded successfully:"
          ls -lh "$APK_FILE"

      - name: Publish GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Ajiro Agent v${{ env.VERSION }}
          files: ajiro-agent-${{ env.VERSION }}.apk
          body_path: .release-notes.md
          generate_release_notes: true
          prerelease: >-
            ${{
              contains(env.VERSION, 'alpha') ||
              contains(env.VERSION, 'beta') ||
              contains(env.VERSION, 'rc') ||
              contains(env.VERSION, 'pre')
            }}

      - name: Skip release
        if: steps.version.outputs.changed == 'false'
        run: |
          echo "Version unchanged."
          echo "APK build and GitHub release skipped."