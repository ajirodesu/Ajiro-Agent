name: Publish Release

# Creates a GitHub Release with the signed APK whenever a v* tag is pushed,
# e.g. git push origin v1.4.7
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   GOOGLE_SERVICES_JSON - Firebase google-services.json for
#     com.ajirodesu.ajiroagent (register the new applicationId in the
#     Firebase console first). Without this the google-services Gradle
#     plugin fails the build.
#   KEY_BASE64           - (optional) base64 of the release keystore.
#   SIGNING_CONFIG       - (optional) local.properties signing entries
#     (storeFile, storePassword, keyAlias, keyPassword).
# Without the signing secrets the APK falls back to debug signing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          fi
          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          fi
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing. Add your Firebase google-services.json (see workflow header)."
            exit 1
          fi
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
