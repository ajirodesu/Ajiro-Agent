name: Publish Release

# Creates a GitHub Release with the signed APK whenever a v* tag is pushed,
# e.g. git push origin v1.4.7
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   GOOGLE_SERVICES_JSON - Firebase google-services.json for
#     com.ajirodesu.ajiroagent (register the new applicationId in the
#     Firebase console first). Without this the google-services Gradle
#     plugin fails the build.
#   KEY_BASE64           - (optional) base64 of the release keystore.
#   SIGNING_CONFIG       - (optional) local.properties signing entries
#     (storeFile, storePassword, keyAlias, keyPassword).
# Without the signing secrets the APK falls back to debug signing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          fi
          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          else
            # TODO: replace with the real Firebase file (register
            # com.ajirodesu.ajiroagent in the Firebase console, then store it
            # as the GOOGLE_SERVICES_JSON repo secret). Placeholder only lets
            # the google-services Gradle plugin pass; Crashlytics/RemoteConfig
            # stay inert until the real file is used.
            echo "::warning::GOOGLE_SERVICES_JSON secret missing, using placeholder Firebase config."
            python3 -c "import json; json.dump({'project_info': {'project_number': '0', 'project_id': 'ajiro-agent-placeholder', 'storage_bucket': 'ajiro-agent-placeholder.appspot.com'}, 'client': [{'client_info': {'mobilesdk_app_id': '1:0:android:000000000000', 'android_client_info': {'package_name': 'com.ajirodesu.ajiroagent'}}, 'oauth_client': [], 'api_key': [{'current_key': 'PLACEHOLDER'}], 'services': {'appinvite_service': {'other_platform_oauth_client': []}}}], 'configuration_version': '1'}, open('app/google-services.json', 'w'), indent=2)"
          fi

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/stable/release/*.apk
          generate_release_notes: true
