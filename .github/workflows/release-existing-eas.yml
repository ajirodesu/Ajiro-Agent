name: Release Existing EAS APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release Existing APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Authenticated Expo account:"
          eas whoami

      - name: Download existing EAS APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          mkdir -p eas-download
          cd eas-download

          eas build:download \
            --build-id 82538d3c-c6d7-488e-bd5c-33ce8b6d9bf3 \
            --non-interactive

          APK_PATH=$(find . -maxdepth 1 -type f -name "*.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "No APK was downloaded."
            exit 1
          fi

          mv "$APK_PATH" ../ajiro-agent-1.1.5.apk

          echo "APK downloaded successfully:"
          ls -lh ../ajiro-agent-1.1.5.apk

      - name: Verify APK
        shell: bash
        run: |
          if [ ! -s "./ajiro-agent-1.1.5.apk" ]; then
            echo "APK is missing or empty."
            exit 1
          fi

          echo "APK verification successful:"
          ls -lh "./ajiro-agent-1.1.5.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.1.5
          name: Ajiro Agent v1.1.5
          files: ./ajiro-agent-1.1.5.apk
          body_path: .release-notes.md
          generate_release_notes: false
          prerelease: false