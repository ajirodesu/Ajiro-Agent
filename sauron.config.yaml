# yaml-language-server: $schema=./schema/sauron.schema.json
version: "1.0.0"

project:
  name: "ajiro-agent"
  description: "Ajiro Agent native Android app (Kotlin, Jetpack Compose, Koin, Room). Namespace me.rerere.rikkahub. Managed by Sauron for OpenCode runtime."
  language: "multi"
  framework: "jetpack-compose"

# The 17 Runtimes Bound by sauron (set true/false per workspace)
# OpenCode-only bind for Ajiro Agent Android workspace
runtimes:
  claude: false
  cursor: false
  windsurf: false
  copilot: false
  cline: false
  trae: false
  zed: false
  codex: false
  gemini: false
  hermes: false
  kimi: false
  kiro: false
  openclaude: false
  opencode: true
  pi: false
  qwen: false
  adal: false
  codebuddy: false

# The Fellowship: 9 Specialized Sub-Agents
# Core Android gate: gandalf (plan), aragorn (architecture), merry (QA). Others disabled to save tokens.
fellowship:
  gandalf:
    enabled: true
    role: "Master Planner and Strategy Guide"
    alias: ["planner", "lead"]
  aragorn:
    enabled: true
    role: "Principal System Architect"
    alias: ["architect", "design"]
  legolas:
    enabled: true
    role: "Precision Linter and Syntax Bug Hunter"
    alias: ["linter", "syntax"]
  gimli:
    enabled: false
    role: "Refactorer and AST Dead Code Slasher"
    alias: ["refactor", "cleanup"]
  boromir:
    enabled: false
    role: "Security Auditor and Shield"
    alias: ["security", "audit"]
  frodo:
    enabled: true
    role: "Core Task Executor and Ringbearer"
    alias: ["executor", "coder"]
  samwise:
    enabled: false
    role: "Git Commits and State Keeper"
    alias: ["commits", "git"]
  merry:
    enabled: true
    role: "QA and TDD Specialist"
    alias: ["tester", "tdd"]
  pippin:
    enabled: false
    role: "Edge Case and Chaos Prober"
    alias: ["fuzzer", "chaos"]

# Active Skill Domains (9 Functional Departments)
# Trimmed for Android compilation cycles: architecture, frontend, quality, security, workflow only
departments:
  architecture: true
  ai-engineering: false
  backend: false
  database: false
  devops: false
  frontend: true
  quality: true
  security: true
  workflow: true

# Token Optimization Engine (Caveman Mode)
caveman:
  default_mode: "lite" # full (~60% token savings) | lite (~40%) | ultra (~75%) | off
  enforce_on_commits: true

# Security & Command Firewall
security:
  agent_guard: true
  block_destructive_commands: true # hard-blocks rm -rf, DROP DATABASE, git push --force
  protect_credentials: true # hard-blocks .env, id_rsa, AWS/GCP credential reads
  enforce_docker_sandbox: false # set true to require Docker container execution

# Safety and Sandboxing Settings
settings:
  backup_existing: true
  dry_run: false
  anti_vibe_coding_strict_mode: true
  circuit_breaker_max_steps: 20
